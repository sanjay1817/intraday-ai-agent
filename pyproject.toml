[project]
name = "intraday-agent"
version = "0.1.0"
description = "AI Intraday Trading Agent — FastAPI service (project foundation)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.32.0,<0.33",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.5.2,<3",
    "sqlalchemy[asyncio]>=2.0.35,<2.1",
    "alembic>=1.13.3,<1.14",
    "asyncpg>=0.29.0,<0.30",
    "psycopg2-binary>=2.9.9,<3",
    "redis[hiredis]>=5.1.1,<6",
    "apscheduler>=3.10.4,<3.11",
    "httpx>=0.27.2,<0.28",
    "structlog>=24.4.0,<25",
    "pyjwt[crypto]>=2.9.0,<3",
    "passlib[bcrypt]>=1.7.4,<2",
    "pandas>=2.3.2,<4",
    "numpy>=2.2.6,<3",
    "pandas-ta>=0.4.71b0,<0.5",
    "python-multipart>=0.0.12,<0.1",
    "websockets>=13.1,<14",
    "tenacity>=9.0.0,<10",
    "pyotp>=2.9.0,<3",
]

# --------------------------------------------------------------------------
# Optional extras. `research` covers the Quant Research Platform
# (app/research) specifically: MLflow, Optuna, scikit-learn, statsmodels,
# SHAP/LIME, etc. are heavy, transitively-large dependencies the live
# trading path never imports, so they're kept out of the core
# `dependencies` list — install with `uv sync --extra research` or
# `pip install .[research]` only when doing research/backtesting work.
# --------------------------------------------------------------------------
[project.optional-dependencies]
research = [
    "mlflow>=2.17.0,<3",
    "optuna>=4.0.0,<5",
    "statsmodels>=0.14.4,<0.15",
    "scikit-learn>=1.5.2,<2",
    "shap>=0.46.0,<1",
    "lime>=0.2.0.1,<0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3,<9",
    "pytest-asyncio>=0.24.0,<0.25",
    "pytest-cov>=5.0.0,<6",
    "pytest-mock>=3.14.0,<4",
    "pytest-env>=1.1.5,<2",
    # 0.9.2 is the actual floor: [tool.ruff.lint]'s UP046/UP047 selectors
    # below don't exist in any earlier ruff release and fail to parse.
    "ruff>=0.9.2,<0.16",
    "black>=24.10.0,<25",
    "mypy>=1.13.0,<2",
    "aiosqlite>=0.20.0,<0.21",
    "faker>=30.8.2,<31",
    "types-passlib>=1.7.7.20240819",
    "pandas-stubs>=2.2.3.241009",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --------------------------------------------------------------------------
# Ruff: linting + import sort. Line length matches Black so the two never
# fight each other over wrapping decisions.
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "ASYNC", # flake8-async
]
ignore = [
    "E501",  # Black owns line length; Ruff formatting warnings are redundant.
    # PEP 695 generic syntax (`class Foo[T]:`) is a parser-level Python 3.12
    # feature. mypy/pytest in some contributors' local environments still run
    # on 3.11, where such a file fails to even parse. `Generic`/`TypeVar` is
    # functionally identical on 3.12, so we keep it project-wide until 3.11
    # support is dropped everywhere it matters.
    "UP046", # non-pep695-generic-class
    "UP047", # non-pep695-generic-function
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

# --------------------------------------------------------------------------
# Black: sole formatting authority. Kept at the same line-length as Ruff.
# --------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]

# --------------------------------------------------------------------------
# Mypy: strict mode. The trading domain must be fully typed — silent `Any`
# leaks are how quantity/price unit bugs slip into production.
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = "pandas_ta.*"
ignore_missing_imports = true

# mlflow is an optional 'research' extra (see [project.optional-dependencies]),
# lazily imported inside MLflowExperimentTracker.__init__ specifically so
# app.research.experiment_tracker itself doesn't require it. mypy runs
# against the core dependency set, where mlflow's stubs are absent.
[[tool.mypy.overrides]]
module = "mlflow.*"
ignore_missing_imports = true

# optuna is likewise an optional 'research' extra, lazily imported inside
# app.research.hyperparameter_optimizer's Bayesian-search path only.
[[tool.mypy.overrides]]
module = "optuna.*"
ignore_missing_imports = true

# statsmodels/scikit-learn are optional 'research' extras, lazily imported
# inside app.research.statistical_analysis's cointegration/PCA/clustering
# functions only.
[[tool.mypy.overrides]]
module = "statsmodels.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

# shap/lime are optional 'research' extras, lazily imported inside
# app.research.explainability's SHAP/LIME functions only.
[[tool.mypy.overrides]]
module = "shap.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lime.*"
ignore_missing_imports = true

# --------------------------------------------------------------------------
# Pytest: async tests default to asyncio mode so `async def test_...`
# functions run without per-test markers.
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"
env = [
    "APP_ENV=testing",
]
